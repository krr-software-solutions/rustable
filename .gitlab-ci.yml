# rustable CI: the pre-merge checks on MRs, and the whole release from a version tag.
#
# The version comes from the tag. Cargo.toml carries the placeholder `0.0.0`; every job that
# builds or publishes a release first runs `scripts/set-version.sh "$CI_COMMIT_TAG"`
# (`v1.2.3` → `1.2.3`). Cut a release by tagging the merged `main`: `git tag v1.2.3 && git push origin v1.2.3`.
#
# A release tag runs:
#   test     check                 fmt, clippy, tests
#   build    build: [<target>]     the `rustable` binary per target (cargo-zigbuild, all from Linux)
#   publish  docker-image          multi-arch image → this project's registry (+ Docker Hub, if configured)
#            gitlab-release        archives → generic package registry, and the GitLab release
#            publish-crates        `cargo publish --workspace` → crates.io (needs CARGO_REGISTRY_TOKEN)
#
# Everything in `publish` waits for `check` and every `build`, so a failing build never leaves a
# half-published version behind. crates.io versions can't be replaced, so publish-crates also
# waits for the image and the GitLab release.
#
# CI variables (Settings → CI/CD → Variables):
#   CARGO_REGISTRY_TOKEN            crates.io token: masked + protected (so `v*` tags must be protected)
#   DOCKERHUB_USER, DOCKERHUB_TOKEN tag pipelines push docker.io/$DOCKERHUB_USER/rustable-sql (protected, like the token)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

include:
  - project: 'krrss/util/pipeline-utils'
    ref: main
    file: '/util.yaml'

stages:
  - test
  - build
  - publish

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: always

# A Rust job: the cargo registry is cached per Cargo.lock.
.rust:
  image: rust:1
  variables:
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  cache:
    key:
      files: [Cargo.lock]
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/

# Release jobs stamp the tag's version into the workspace first (MR pipelines keep 0.0.0).
.set-version:
  before_script:
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then scripts/set-version.sh "$CI_COMMIT_TAG"; fi

# ----- test -----

check-pre-merge:
  extends:
    - .runner
    - ".mr=auto,tag=never"
  stage: test
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/check-for-fix.sh

check:
  extends:
    - .runner
    - .rust
    - ".mr=auto,tag=auto"
  stage: test
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --locked
    - cargo test --workspace --locked

# Packages and verifies every crate the way crates.io will see it (with the 0.0.0 placeholder).
publish-dry-run:
  extends:
    - .runner
    - .rust
    - ".mr=auto,tag=never"
  stage: test
  script:
    - cargo publish --workspace --dry-run --locked

# ----- build -----

# The CLI for one target, cross-compiled with cargo-zigbuild (bundled SQLite included). zig's
# linker ad-hoc signs the aarch64-apple-darwin binary, which is all Apple Silicon needs to run a
# binary that isn't quarantined (curl, Homebrew formulae). Manual on MRs, to try a build.
build:
  extends:
    - .runner
    - .rust
    - ".mr=manual,tag=auto"
  stage: build
  needs: []
  image: ghcr.io/rust-cross/cargo-zigbuild:0.24.0
  parallel:
    matrix:
      - TARGET:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
  script:
    # The image's Rust lags behind; sqlx 0.9 needs 1.94+.
    - rustup toolchain install stable --profile minimal --no-self-update
    - rustup default stable
    - rustup target add "$TARGET"
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then scripts/set-version.sh "$CI_COMMIT_TAG"; fi
    - cargo zigbuild --release --locked -p rustable-sql-cli --target "$TARGET"
    - version="${CI_COMMIT_TAG:-v0.0.0}"; version="${version#v}"
    - name="rustable-sql-$version-$TARGET"
    - mkdir -p "dist/$name"
    - cp "target/$TARGET/release/rustable" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
    - tar -C dist -czf "dist/$name.tar.gz" "$name"
    - (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
    # The static Linux binaries are also what the Docker image ships.
    - |
      case "$TARGET" in
        x86_64-unknown-linux-musl)  arch=amd64 ;;
        aarch64-unknown-linux-musl) arch=arm64 ;;
        *)                          arch= ;;
      esac
      if [ -n "$arch" ]; then
        mkdir -p "dist/docker/$arch"
        cp "target/$TARGET/release/rustable" "dist/docker/$arch/rustable"
      fi
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*.tar.gz
      - dist/*.tar.gz.sha256
      - dist/docker/

# ----- publish -----

# Multi-arch image from the prebuilt binaries (the Dockerfile only COPYs, so no QEMU).
# On a tag: `<version>` (+ `latest` unless it's a pre-release), to Docker Hub and this project's
# registry. Manual on MRs: `mr-<iid>`, to this project's registry only.
docker-image:
  extends:
    - .runner
    - ".mr=manual,tag=auto"
  stage: publish
  needs: [check, build]
  image: docker:28
  services:
    - name: docker:28-dind
  variables:
    # DinD without TLS: daemon and CLI share the pod (same setup as food-app).
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        version="${CI_COMMIT_TAG#v}"
        tags="$version"
        case "$version" in *-*) ;; *) tags="$tags latest" ;; esac
      else
        tags="mr-$CI_MERGE_REQUEST_IID"
      fi
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      args=""
      for t in $tags; do args="$args -t $CI_REGISTRY_IMAGE:$t"; done
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        # Fail rather than quietly skip Docker Hub: protected variables are empty on unprotected tags.
        if [ -z "${DOCKERHUB_USER:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
          echo "DOCKERHUB_USER/DOCKERHUB_TOKEN are not set (they're protected: is this tag protected?)"
          exit 1
        fi
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
        for t in $tags; do args="$args -t docker.io/$DOCKERHUB_USER/rustable-sql:$t"; done
      fi
      docker buildx create --use
      docker buildx build --platform linux/amd64,linux/arm64 \
        --label "org.opencontainers.image.version=${CI_COMMIT_TAG:-mr-$CI_MERGE_REQUEST_IID}" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
        $args --push .

gitlab-release:
  extends:
    - .runner
    - ".mr=never,tag=auto"
  stage: publish
  needs: [check, build]
  image: alpine:3.21
  before_script:
    - apk add --no-cache curl jq
  script:
    - scripts/gitlab-release.sh

publish-crates:
  extends:
    - .runner
    - .rust
    - .set-version
    - ".mr=never,tag=auto"
  stage: publish
  needs: [check, build, docker-image, gitlab-release]
  script:
    - '[ -n "${CARGO_REGISTRY_TOKEN:-}" ] || { echo "CARGO_REGISTRY_TOKEN is not set (it must be protected, and so must the tag)"; exit 1; }'
    # set-version just rewrote Cargo.toml/Cargo.lock, hence --allow-dirty.
    - cargo publish --workspace --locked --allow-dirty
