[[table]]
name = "link_hits"
primary_key = ["id"]

[[table.column]]
name = "id"
type = "BIGINT"
nullable = false
generated = "GENERATED BY DEFAULT AS IDENTITY"

[[table.column]]
name = "link_id"
type = "BIGINT"
nullable = false

[[table.column]]
name = "referrer"
type = "TEXT"
nullable = true

[[table.column]]
name = "user_agent"
type = "TEXT"
nullable = true

[[table.column]]
name = "hit_at"
type = "TIMESTAMPTZ"
nullable = false
default = "now()"

[[table.index]]
name = "link_hits_link_id_hit_at_idx"
columns = [
    "link_id",
    "hit_at DESC",
]

[[table.foreign_key]]
name = "link_hits_link_id_fkey"
columns = ["link_id"]
references_table = "links"
references_columns = ["id"]
on_delete = "CASCADE"

[[table]]
name = "links"
primary_key = ["id"]
comment = "One row per short code."

[[table.column]]
name = "id"
type = "BIGINT"
nullable = false
generated = "GENERATED ALWAYS AS IDENTITY"

[[table.column]]
name = "code"
type = "VARCHAR(16)"
nullable = false

[[table.column]]
name = "target_url"
type = "TEXT"
nullable = false

[[table.column]]
name = "visibility"
type = "LINK_VISIBILITY"
nullable = false
default = "'public'"

[[table.column]]
name = "hit_count"
type = "BIGINT"
nullable = false
default = "0"
comment = "Maintained by trigger link_hits_bump_count; do not write directly."

[[table.column]]
name = "expires_at"
type = "TIMESTAMPTZ"
nullable = true

[[table.column]]
name = "created_at"
type = "TIMESTAMPTZ"
nullable = false
default = "now()"

[[table.index]]
name = "links_code_key"
columns = ["code"]
unique = true
constraint = true

[[table.index]]
name = "links_never_expire_idx"
columns = ["code"]
where = "expires_at IS NULL"

[[table.check]]
name = "links_code_check"
expr = "code ~ '^[A-Za-z0-9_-]+$'"

[[table.check]]
name = "links_expiry_in_future"
expr = "expires_at IS NULL OR expires_at > created_at"

[[enum]]
name = "link_visibility"
values = [
    "public",
    "unlisted",
    "private",
]

[[object]]
kind = "function"
name = "bump_link_hit_count"

[[object]]
kind = "trigger"
name = "link_hits_bump_count"
table = "link_hits"
